{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="card shadow-sm">
            <div class="card-header bg-warning">
                <h4 class="mb-0">Edit Student</h4>
            </div>

            <div class="card-body">
                <form
                    method="POST"
                    onsubmit="return validateStudentForm(this)"
                >

                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student['name'] }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student['email'] }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone *</label>
                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ student['phone'] }}"
                            maxlength="10"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department *</label>
                        <select name="department" class="form-select" required>
                            <option value="">Select department</option>

                            {% for department in [
                                "Computer Science",
                                "Information Technology",
                                "Electronics",
                                "Mechanical",
                                "Civil",
                                "Commerce"
                            ] %}
                                <option
                                    value="{{ department }}"
                                    {% if student['department'] == department %}
                                        selected
                                    {% endif %}
                                >
                                    {{ department }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Year *</label>
                        <select name="year" class="form-select" required>
                            {% for year in [1, 2, 3, 4] %}
                                <option
                                    value="{{ year }}"
                                    {% if student['year']|int == year %}
                                        selected
                                    {% endif %}
                                >
                                    {{ year }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                        >{{ student['address'] or '' }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-success">
                        Save Changes
                    </button>

                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
